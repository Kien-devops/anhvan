apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anhvan-ingress
  namespace: anhvan
  labels:
    app: anhvan
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: anhvan.onprem.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anhvan-service
                port:
                  number: 80
