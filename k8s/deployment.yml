apiVersion: apps/v1
kind: Deployment
metadata:
  name: anhvan-app
  namespace: anhvan
  labels:
    app: anhvan
    app.kubernetes.io/name: anhvan
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: anhvan
  template:
    metadata:
      labels:
        app: anhvan
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-tang4
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: anhvan
          image: ghcr.io/kien-devops/anhvan:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: ROUTER_URL
              value: "https://9router.onprem.site/v1"
            - name: ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: anhvan-secrets
                  key: router-key
            - name: ROUTER_MODEL
              value: "gpt-5.6-sol"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: anhvan-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anhvan-secrets
                  key: google-client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: anhvan-secrets
                  key: session-secret
            - name: APP_BASE_URL
              value: "https://anhvan.onprem.site"
            - name: NODE_ENV
              value: "production"
            - name: DATA_DIR
              value: "/app/data"
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: data-volume
          hostPath:
            path: /opt/anhvan-data
            type: DirectoryOrCreate
